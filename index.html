<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY Nav | Malaysia Route & Navigation</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tailwind CSS for modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 100vh; width: 100vw; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 font-sans overflow-hidden">

    <!-- Floating Navigation Control Panel -->
    <div class="fixed top-4 left-4 z-[1000] w-full max-w-sm bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200 overflow-hidden max-h-[92vh] flex flex-col">
        <!-- Header -->
        <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-none">MY Nav</h1>
                    <span class="text-xs text-slate-400 font-medium">Malaysia Route & Navigation</span>
                </div>
            </div>
            <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-1 rounded font-semibold border border-emerald-500/30">MY</span>
        </div>

        <div class="p-4 space-y-4 overflow-y-auto custom-scrollbar flex-1">
            
            <!-- Quick Destination Shortcuts -->
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Quick Destination (Malaysia Cities)</label>
                <select id="quickDest" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- Choose Quick Landmark --</option>
                    <option value="3.1579,101.7116">KLCC, Kuala Lumpur</option>
                    <option value="2.9264,101.6964">Putrajaya Cyberjaya</option>
                    <option value="2.7456,101.7072">KLIA Terminal 1</option>
                    <option value="1.4927,103.7414">Johor Bahru Central</option>
                    <option value="5.4164,100.3327">George Town, Penang</option>
                    <option value="4.5975,101.0901">Ipoh, Perak</option>
                    <option value="2.1896,102.2501">Melaka City</option>
                    <option value="3.8126,103.3256">Kuantan, Pahang</option>
                </select>
            </div>

            <!-- Origin Input -->
            <div class="relative">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 bg-emerald-500 rounded-full flex-shrink-0"></span>
                    <input type="text" id="startInput" placeholder="Origin (e.g. Current Location or KLCC)" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 pl-3 focus:ring-blue-500 focus:border-blue-500">
                    <button onclick="useGPS()" title="Use Current GPS" class="p-2.5 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg text-slate-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Destination Input -->
            <div class="relative">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 bg-rose-500 rounded-full flex-shrink-0"></span>
                    <input type="text" id="destInput" placeholder="Destination (e.g. Johor Bahru)" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 pl-3 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <!-- Routing Mode Selection -->
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Routing Mode</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setRoutingMode('fastest')" id="btn-fastest" class="route-btn active bg-blue-50 text-blue-700 border-2 border-blue-600 font-semibold text-xs py-2 px-1 rounded-lg flex flex-col items-center justify-center transition-all">
                        <svg class="w-4 h-4 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Highway/Fast
                    </button>
                    <button onclick="setRoutingMode('avoid_tolls')" id="btn-avoid_tolls" class="route-btn bg-slate-50 text-slate-600 border border-slate-200 font-semibold text-xs py-2 px-1 rounded-lg flex flex-col items-center justify-center hover:bg-slate-100 transition-all">
                        <svg class="w-4 h-4 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
                        Avoid Tolls
                    </button>
                    <button onclick="setRoutingMode('shortest')" id="btn-shortest" class="route-btn bg-slate-50 text-slate-600 border border-slate-200 font-semibold text-xs py-2 px-1 rounded-lg flex flex-col items-center justify-center hover:bg-slate-100 transition-all">
                        <svg class="w-4 h-4 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                        Shortest
                    </button>
                </div>
            </div>

            <!-- Calculate Button -->
            <button onclick="calculateRoute()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all duration-200 flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Calculate Best Route</span>
            </button>

            <!-- Route Summary & Results -->
            <div id="routeResults" class="hidden space-y-3 pt-2 border-t border-slate-200">
                <div class="bg-slate-900 text-white p-3 rounded-xl">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs text-slate-400 font-semibold uppercase">Trip Summary</span>
                        <span id="tollBadge" class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded font-bold">PLUS Highway Route</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center mt-2">
                        <div class="bg-slate-800 p-2 rounded-lg">
                            <span class="text-[10px] text-slate-400 block">Distance</span>
                            <span id="resDistance" class="font-bold text-sm text-blue-400">0 km</span>
                        </div>
                        <div class="bg-slate-800 p-2 rounded-lg">
                            <span class="text-[10px] text-slate-400 block">Est. Time</span>
                            <span id="resTime" class="font-bold text-sm text-emerald-400">0 mins</span>
                        </div>
                        <div class="bg-slate-800 p-2 rounded-lg">
                            <span class="text-[10px] text-slate-400 block">Est. Toll</span>
                            <span id="resToll" class="font-bold text-sm text-amber-400">RM 0.00</span>
                        </div>
                    </div>
                </div>

                <!-- Turn-by-Turn Directions -->
                <div>
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Turn-by-Turn Directions</h3>
                    <div id="instructionsList" class="space-y-1.5 max-h-48 overflow-y-auto custom-scrollbar text-xs text-slate-700"></div>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="p-2.5 bg-slate-100 border-t border-slate-200 text-center text-[10px] text-slate-500">
            Powered by OpenStreetMap, Leaflet & OSRM • OpenShift Ready
        </div>
    </div>

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize Map centered on Kuala Lumpur, Malaysia
        const map = L.map('map', { zoomControl: false }).setView([3.1390, 101.6869], 11);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
}).addTo(map);

        let startMarker, destMarker, routePolyline;
        let startCoords = [3.1390, 101.6869]; // Default KL
        let destCoords = null;
        let selectedMode = 'fastest';

        // Predefined Malaysia Landmark Coordinates
        const landmarks = {
            "3.1579,101.7116": "KLCC, Kuala Lumpur",
            "2.9264,101.6964": "Putrajaya Cyberjaya",
            "2.7456,101.7072": "KLIA Terminal 1",
            "1.4927,103.7414": "Johor Bahru Central",
            "5.4164,100.3327": "George Town, Penang",
            "4.5975,101.0901": "Ipoh, Perak",
            "2.1896,102.2501": "Melaka City",
            "3.8126,103.3256": "Kuantan, Pahang"
        };

        // Quick Select Handler
        document.getElementById('quickDest').addEventListener('change', function(e) {
            if (!e.target.value) return;
            const [lat, lng] = e.target.value.split(',').map(Number);
            setDestination(lat, lng, landmarks[e.target.value]);
        });

        // Set Destination Helper
        function setDestination(lat, lng, label) {
            destCoords = [lat, lng];
            document.getElementById('destInput').value = label || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            
            if (destMarker) map.removeLayer(destMarker);
            destMarker = L.marker([lat, lng], {
                icon: L.divIcon({
                    className: 'custom-div-icon',
                    html: "<div style='background-color:#ef4444;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.4);'></div>",
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                })
            }).addTo(map).bindPopup("Destination: " + (label || "Selected Location")).openPopup();

            map.flyTo([lat, lng], 12);
        }

        // Map Click Event to Set Destination
        map.on('click', function(e) {
            setDestination(e.latlng.lat, e.latlng.lng, `Location (${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)})`);
        });

        // Mode Switching
        function setRoutingMode(mode) {
            selectedMode = mode;
            document.querySelectorAll('.route-btn').forEach(btn => {
                btn.classList.remove('bg-blue-50', 'text-blue-700', 'border-2', 'border-blue-600');
                btn.classList.add('bg-slate-50', 'text-slate-600', 'border', 'border-slate-200');
            });

            const activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.classList.remove('bg-slate-50', 'text-slate-600', 'border-slate-200');
            activeBtn.classList.add('bg-blue-50', 'text-blue-700', 'border-2', 'border-blue-600');
        }

        // Use Browser GPS Location
        function useGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    startCoords = [position.coords.latitude, position.coords.longitude];
                    document.getElementById('startInput').value = "My Location (GPS)";
                    
                    if (startMarker) map.removeLayer(startMarker);
                    startMarker = L.marker(startCoords, {
                        icon: L.divIcon({
                            className: 'custom-div-icon',
                            html: "<div style='background-color:#10b981;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.4);'></div>",
                            iconSize: [16, 16],
                            iconAnchor: [8, 8]
                        })
                    }).addTo(map).bindPopup("Start: GPS Location");

                    map.flyTo(startCoords, 13);
                }, () => {
                    alert("Unable to fetch GPS position. Defaulting to Kuala Lumpur.");
                });
            }
        }

        // Calculate Route via OSRM Engine
        async function calculateRoute() {
            if (!destCoords) {
                alert("Please select or click a destination on the map first.");
                return;
            }

            // Define profile based on user preference
            let profile = 'driving';
            let extraParams = '';

            if (selectedMode === 'shortest') {
                extraParams = '&annotations=distance,duration';
            }

            const url = `https://router.project-osrm.org/route/v1/${profile}/${startCoords[1]},${startCoords[0]};${destCoords[1]},${destCoords[0]}?overview=full&geometries=geojson&steps=true${extraParams}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (!data.routes || data.routes.length === 0) {
                    alert("Route calculation failed. Try another point.");
                    return;
                }

                const route = data.routes[0];
                const distanceKm = (route.distance / 1000).toFixed(1);
                const durationMins = Math.round(route.duration / 60);

                // Estimate Malaysia Highway Toll Costs (~RM 0.13 per km on major highways)
                let estToll = 0;
                let tollText = "Likely Toll Free";
                if (selectedMode !== 'avoid_tolls' && distanceKm > 15) {
                    estToll = (distanceKm * 0.136).toFixed(2);
                    tollText = "RM " + estToll;
                    document.getElementById('tollBadge').innerText = "PLUS / Expressway Route";
                    document.getElementById('tollBadge').className = "text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded font-bold";
                } else {
                    document.getElementById('tollBadge').innerText = "Federal Route / Toll Free";
                    document.getElementById('tollBadge').className = "text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded font-bold";
                }

                // Render Summary Results
                document.getElementById('resDistance').innerText = `${distanceKm} km`;
                document.getElementById('resTime').innerText = durationMins > 60 ? `${Math.floor(durationMins/60)}h ${durationMins%60}m` : `${durationMins} mins`;
                document.getElementById('resToll').innerText = tollText;
                document.getElementById('routeResults').classList.remove('hidden');

                // Render Turn-by-Turn Steps
                const stepsContainer = document.getElementById('instructionsList');
                stepsContainer.innerHTML = '';
                route.legs[0].steps.forEach((step, idx) => {
                    if (step.maneuver.instruction || step.name) {
                        const div = document.createElement('div');
                        div.className = "bg-slate-50 p-2 rounded border border-slate-200 flex items-start space-x-2";
                        div.innerHTML = `
                            <span class="font-bold text-slate-400 text-[10px]">${idx + 1}.</span>
                            <div class="flex-1">
                                <p class="font-medium text-slate-800">${step.maneuver.type} ${step.name ? 'onto <b>' + step.name + '</b>' : ''}</p>
                                <span class="text-[10px] text-slate-400">${(step.distance / 1000).toFixed(2)} km</span>
                            </div>
                        `;
                        stepsContainer.appendChild(div);
                    }
                });

                // Plot Line on Map
                if (routePolyline) map.removeLayer(routePolyline);
                const coordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
                
                routePolyline = L.polyline(coordinates, {
                    color: selectedMode === 'avoid_tolls' ? '#10b981' : '#2563eb',
                    weight: 6,
                    opacity: 0.8
                }).addTo(map);

                // Zoom Map to Fit Complete Route
                map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });

            } catch (err) {
                console.error(err);
                alert("Error connecting to OSRM routing engine.");
            }
        }

        // Set initial start marker
        startMarker = L.marker(startCoords, {
            icon: L.divIcon({
                className: 'custom-div-icon',
                html: "<div style='background-color:#10b981;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.4);'></div>",
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            })
        }).addTo(map).bindPopup("Start: Kuala Lumpur");
    </script>
</body>
</html>
