apiVersion: apps/v1
kind: Deployment
metadata:
  name: malaysia-nav-app
  labels:
    app: malaysia-nav-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: malaysia-nav-app
  template:
    metadata:
      labels:
        app: malaysia-nav-app
    spec:
      containers:
      - name: web
        image: quay.io/your-username/malaysia-nav-app:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: malaysia-nav-app
spec:
  selector:
    app: malaysia-nav-app
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: malaysia-nav-app
spec:
  to:
    kind: Service
    name: malaysia-nav-app
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect